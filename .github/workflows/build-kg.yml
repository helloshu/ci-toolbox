name: build-kg

# target a — full platform matrix: Android, Linux, Windows, macOS.
#
# Upstream is All Rights Reserved / personal use only: the artifacts are for the
# repository owner's own devices, do not redistribute them.
#
# Billing (GitHub Free, per run):
#   ubuntu  1x | windows 2x | macOS 10x
#   android 30 + linux 18 + windows 22*2 + macos 20*10 = 292 -> ~6 runs/month
#   (matters only for a private repository; standard runners are free when public)
# That is why this workflow is meant to run in a PUBLIC repository (unlimited
# standard runners) while the patches stay in a PRIVATE repository — see
# scripts/fetch-patches.sh and the README.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma separated subset of: android,linux,windows,macos,ios (linux = deb + AppImage)"
        type: string
        default: "android,linux,windows,macos"
      publish_release:
        description: "Attach the artifacts to a GitHub Release"
        type: boolean
        default: false
  push:
    tags: ['kg-*']

permissions:
  contents: write

concurrency:
  group: kg-${{ github.ref }}
  cancel-in-progress: false

env:
  SDK_PLATFORM: "37.1"
  BUILD_TOOLS: "37.0.0"
  NDK: "27.0.12077973"
  RUST_TOOLCHAIN: "beta-2026-07-15"
  RUST_ANDROID_TARGETS: "aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g"

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    environment: build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android
            os: ubuntu-latest
            tasks: ":androidApp:assembleNoneRelease"
          # One package per row: two jpackage tasks in one invocation trip Gradle's
          # implicit-dependency validation, and sharing the build directory between
          # them loses generated resources (keyguard-ssh-agent).
          - id: linux-deb
            os: ubuntu-latest
            tasks: ":desktopApp:packageReleaseDeb"
          - id: linux-appimage
            os: ubuntu-latest
            tasks: ":desktopApp:packageReleaseAppImage"
          - id: windows
            os: windows-latest
            tasks: ":desktopApp:packageReleaseMsi"
          - id: macos
            os: macos-15
            tasks: ":desktopApp:packageReleaseDmg"
          # upstream ships an XcodeGen project (iosApp/) that is not published yet;
          # opt-in only; unsigned, so it needs re-signing to run on a device.
          - id: ios
            os: macos-15
            tasks: ""
    steps:
      - name: Skip unrequested platform
        id: gate
        shell: bash
        run: |
          want="${{ inputs.platforms }}"
          [ -n "$want" ] || want="android,linux,windows,macos"
          run=false
          case ",$want," in *",${{ matrix.id }},"*) run=true ;; esac
          # `linux` selects both linux-* rows
          case "${{ matrix.id }}" in
            linux-*) case ",$want," in *",linux,"*) run=true ;; esac ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "skipping ${{ matrix.id }}"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # Explicit cache instead of setup-java's `cache: gradle`: at that point the
      # repository has no gradlew yet (the upstream tree is cloned later).
      - name: Cache Gradle and Kotlin
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('targets/**/patches/**', 'targets/**/source.env') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK packages
        if: steps.gate.outputs.run == 'true' && matrix.id == 'android'
        shell: bash
        run: ./scripts/install-android-sdk.sh "platforms;android-${SDK_PLATFORM}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK}"

      # Compose Desktop needs WiX 3 to build an MSI.
      - name: Install WiX (Windows installer toolkit)
        if: steps.gate.outputs.run == 'true' && matrix.id == 'windows'
        shell: bash
        run: choco install wixtoolset --no-progress -y

      - name: Fetch source and apply patches
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          PATCHES_REPO: ${{ vars.PATCHES_REPO }}
          PATCHES_TOKEN: ${{ secrets.PATCHES_TOKEN }}
        run: |
          chmod +x scripts/*.sh targets/kg/scripts/*.sh
          ./scripts/fetch-patches.sh targets/kg
          ./scripts/prepare-upstream.sh targets/kg "$PWD/src/kg"

      # The Linux desktop target links against X11 (keyguard-lib -> -lX11).
      - name: Install Linux desktop build deps
        if: steps.gate.outputs.run == 'true' && startsWith(matrix.id, 'linux')
        shell: bash
        run: |
          sudo apt-get update -qq
          # X11 for keyguard-lib, libudev for the FIDO2/hidapi crates, xvfb+gtk
          # because :desktopApp:createReleaseAotArchive launches the packaged app.
          sudo apt-get install -y -qq \
            libx11-dev libxrender-dev libxtst-dev libxi-dev libxkbcommon-dev \
            libudev-dev libpcsclite-dev libgtk-3-0 xvfb

      # prost-build shells out to protoc for the agent protobufs; the runner
      # images do not ship it on every OS.
      - name: Install XcodeGen
        if: steps.gate.outputs.run == 'true' && matrix.id == 'ios'
        shell: bash
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Install protobuf compiler
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler ;;
            macOS)   brew install protobuf ;;
            Windows) choco install protoc --no-progress -y ;;
          esac
          protoc --version

      # Serial on purpose: parallel `rustup component add` runs corrupt each
      # other's download temp files.
      - name: Rust toolchain
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" clippy rustfmt
          if [ "${{ matrix.id }}" = "android" ]; then
            for t in $RUST_ANDROID_TARGETS; do
              rustup target add --toolchain "$RUST_TOOLCHAIN" "$t"
            done
          fi
          if [ "${{ matrix.id }}" = "ios" ]; then
            for t in aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin; do
              rustup target add --toolchain "$RUST_TOOLCHAIN" "$t"
            done
          fi
          rustup show active-toolchain

      - name: Cache Cargo and Rust toolchain
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          # keyed per OS, not per matrix row: the linux-* rows and the macos rows
          # share compiler output, so only the first one pays for the cold build
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            src/kg/**/build/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('targets/kg/patches/**') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Release signing material
        if: steps.gate.outputs.run == 'true' && matrix.id == 'android'
        shell: bash
        env:
          SIGN_KG_B64: ${{ secrets.SIGN_KG_B64 }}
          KEYSTORE_PASS: ${{ secrets.SIGN_KG_PASS }}
          KEY_PASS: ${{ secrets.SIGN_KG_KEY_PASS }}
        run: ./targets/kg/scripts/install-signing.sh "$PWD/src/kg"

      - name: Build (iOS, unsigned)
        if: steps.gate.outputs.run == 'true' && matrix.id == 'ios'
        shell: bash
        working-directory: src/kg
        run: |
          set -o pipefail
          # SwiftPM resolves the local binary target before any scheme pre-action,
          # so build the iosArm64 slice up front (same task the pre-action uses).
          ./gradlew :appleApp:syncKeyguardSharedIosArm64ReleaseXCFrameworkForSwiftPackage
          ( cd iosApp && xcodegen generate )
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme Keyguard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build
        if: steps.gate.outputs.run == 'true' && matrix.id != 'ios'
        shell: bash
        working-directory: src/kg
        env:
          # createReleaseAotArchive launches the packaged app to dump an AppCDS
          # archive; headless linux runners hang on it and it only affects start-up.
          EXTRA_GRADLE_ARGS: ${{ startsWith(matrix.id, 'linux') && '-x createReleaseAotArchive' || '' }}
        run: |
          # The Compose packaging tasks copy app-resources into the image without
          # depending on the Sync task that stages them, so stage them first in
          # their own invocation and let the packaging run see a complete tree.
          # shellcheck disable=SC2086
          case "${{ matrix.id }}" in
            linux-*) ./gradlew :desktopApp:prepareBundledAppResources ;;
          esac
          # shellcheck disable=SC2086
          ./gradlew ${EXTRA_GRADLE_ARGS:-} ${{ matrix.tasks }} \
            -Pbuildkonfig.flavor=release \
            -PversionRef=local \
            --console=plain --stacktrace \
            --max-workers=4

      - name: Collect artifacts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out/${{ matrix.id }}"
          case "${{ matrix.id }}" in
            android)
              apk="$(find src/kg/androidApp/build/outputs/apk/none/release -name '*.apk' ! -name '*unsigned*' | head -1)"
              [ -n "$apk" ] || apk="$(find src/kg/androidApp/build/outputs/apk/none/release -name '*.apk' | head -1)"
              cp "$apk" "$out/${{ matrix.id }}/a-android.apk"
              ;;
            ios)
              app="src/kg/build/ios/Build/Products/Release-iphoneos/Keyguard.app"
              if [ -d "$app" ]; then
                mkdir -p "$out/${{ matrix.id }}/Payload"
                cp -R "$app" "$out/${{ matrix.id }}/Payload/"
                ( cd "$out/${{ matrix.id }}" && zip -qry kg-ios-unsigned.ipa Payload && rm -rf Payload )
              else
                echo "no Keyguard.app produced" >&2; exit 1
              fi
              ;;
            *)
              # Compose puts the packages under build/compose/binaries/main-release
              find src/kg/desktopApp/build/compose/binaries -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar' -o -name '*.tar.gz' \) \
                -exec cp {} "$out/${{ matrix.id }}/" \; || true
              ;;
          esac
          ls -la "$out/${{ matrix.id }}"

      - name: Checksums
        if: steps.gate.outputs.run == 'true'
        shell: bash
        working-directory: out
        run: sha256sum "${{ matrix.id }}"/* >> SHA256SUMS || true

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: kg-${{ matrix.id }}
          path: out/${{ matrix.id }}/*
          if-no-files-found: warn
          retention-days: 14

  source:
    # The corresponding source is platform independent; pack it once.
    runs-on: ubuntu-latest
    environment: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source and apply patches
        env:
          PATCHES_REPO: ${{ vars.PATCHES_REPO }}
          PATCHES_TOKEN: ${{ secrets.PATCHES_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-patches.sh targets/kg
          ./scripts/prepare-upstream.sh targets/kg "$PWD/src/kg"
      - name: Tarball
        run: |
          mkdir -p out
          ./scripts/make-source-tarball.sh src/kg out/kg-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kg-source
          path: out/kg-source.tar.gz
          retention-days: 14

  publish:
    needs: [build, source]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
    runs-on: ubuntu-latest
    environment: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
        run: |
          cd artifacts && sha256sum * > SHA256SUMS 2>/dev/null || true; cd ..
          tag="${GITHUB_REF_NAME}"
          case "$tag" in kg-*) ;; *) tag="kg-${GITHUB_RUN_NUMBER}" ;; esac
          repo="${RELEASE_REPO:-$GITHUB_REPOSITORY}"
          gh release create "$tag" artifacts/* \
            --title "build-kg ${tag}" \
            --notes-file targets/kg/notes.md \
            --repo "$repo" || \
          gh release upload "$tag" artifacts/* --clobber --repo "$repo"
