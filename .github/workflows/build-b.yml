name: build-b

# target b — Android: two release variants, entitlement unlocked, signed APKs.
# Upstream is GPLv3: each release also carries the corresponding patched source.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the artifacts to a GitHub Release"
        type: boolean
        default: false
  push:
    tags: ['b-*']

permissions:
  contents: write

concurrency:
  group: b-${{ github.ref }}
  cancel-in-progress: false

env:
  SDK_PLATFORM: "37.0"
  BUILD_TOOLS: "37.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Explicit cache instead of setup-java's `cache: gradle`: at that point the
      # repository has no gradlew yet (the upstream tree is cloned later).
      - name: Cache Gradle and Kotlin
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('targets/**/patches/**', 'targets/**/source.env') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install SDK packages
        run: ./scripts/install-android-sdk.sh "platforms;android-${SDK_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Fetch source and apply patches
        env:
          PATCHES_REPO: ${{ vars.PATCHES_REPO }}
          PATCHES_TOKEN: ${{ secrets.PATCHES_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/fetch-patches.sh targets/b
          ./scripts/prepare-upstream.sh targets/b "$PWD/src/b"

      - name: Build release variants
        working-directory: src/b
        run: |
          ./gradlew -I "$GITHUB_WORKSPACE/targets/b/no-lint.gradle" \
            :presentation:assemblePlaystoreRelease \
            :presentation:assemblePlaystoreiapRelease \
            --console=plain --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx5g

      - name: Prepare signing keystore
        env:
          SIGN_B_B64: ${{ secrets.SIGN_B_B64 }}
          KEYSTORE_PASS: ${{ secrets.SIGN_B_PASS }}
          KEY_PASS: ${{ secrets.SIGN_B_KEY_PASS }}
        run: |
          if [ -n "${SIGN_B_B64:-}" ]; then
            echo "$SIGN_B_B64" | base64 -d > "$RUNNER_TEMP/build.jks"
          else
            ./scripts/make-keystore.sh "$RUNNER_TEMP/build.jks" build
          fi

      - name: Align and sign
        env:
          KEYSTORE_PASS: ${{ secrets.SIGN_B_PASS }}
          KEY_PASS: ${{ secrets.SIGN_B_KEY_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASS:=localbuild}"; : "${KEY_PASS:=$KEYSTORE_PASS}"
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out"
          base="src/b/presentation/build/outputs/apk"
          ./scripts/sign-apk.sh "$base/playstore/release/presentation-playstore-release-unsigned.apk" \
            "$out/b-universal.apk" "$RUNNER_TEMP/build.jks"
          ./scripts/sign-apk.sh "$base/playstoreiap/release/presentation-playstoreiap-release-unsigned.apk" \
            "$out/b-freemium-universal.apk" "$RUNNER_TEMP/build.jks"

      - name: Checksums and source tarball
        run: |
          cd "$GITHUB_WORKSPACE/out" && sha256sum *.apk > SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          ./scripts/make-source-tarball.sh src/b out/b-source.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: b
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in b-*) ;; *) tag="b-${GITHUB_RUN_NUMBER}" ;; esac
          gh release create "$tag" out/* \
            --title "build-b ${tag}" \
            --notes-file "$GITHUB_WORKSPACE/targets/b/notes.md" \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$tag" out/* --clobber --repo "$GITHUB_REPOSITORY"
